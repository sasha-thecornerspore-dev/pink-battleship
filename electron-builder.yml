appId: dev.cornerspore.pinkbattleship
productName: Pink Battleship
copyright: © Corner Spore

directories:
  output: release
  buildResources: build

# electron-vite emits to out/. Native modules must stay unpacked from the asar.
files:
  - out/**/*
  - package.json
asarUnpack:
  - "**/*.node"
  # Optional native media tooling (thumbnails + probing) ships unpacked so the
  # binaries are executable at runtime.
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"

# The auto-update feed. Baked into every build as app-update.yml, so it must
# point at a repo end users can read anonymously. Keep in sync with
# src/shared/release.ts and RELEASE_REPO in .github/workflows/release.yml.
# CI builds with --publish never; the workflow's publish job uploads.
publish:
  provider: github
  owner: sasha-thecornerspore-dev
  repo: pink-battleship
  releaseType: release

# File names avoid spaces (GitHub rewrites them, which breaks the update feed).
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Windows code signing: Azure Trusted Signing options are passed by CI when
  # the secrets exist (see docs/distribution.md). Do not commit certs.

nsis:
  artifactName: PinkBattleship-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Pink Battleship
  createDesktopShortcut: always

portable:
  artifactName: PinkBattleship-Portable-${version}.${ext}

mac:
  # dmg for first install; zip is what electron-updater (Squirrel.Mac) downloads.
  # Each runner builds its native arch (arm64 / x64) so native modules match.
  target:
    - dmg
    - zip
  artifactName: PinkBattleship-${version}-mac-${arch}.${ext}
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  # Signing identity + notarization (notarytool, App Store Connect API key) are
  # supplied by CI when the secrets exist; otherwise the app is ad-hoc signed.
